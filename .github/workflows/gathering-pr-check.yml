name: Tests v0.5 - Recolte / Socket

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PySide6
        run: python -m pip install "PySide6-Essentials>=6.12,<6.13"
      - name: Tests hors jeu et interface offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          SAMI_DISABLE_UPDATE_CHECK: '1'
        run: python -m unittest discover -s tests -v
